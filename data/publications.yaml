#
# How to edit:
#   - Put / remove a paper in "Selected Publications": set `selected: true` / `false`.
#   - Order: papers appear in the order written here (in both views). Keep newest first.
#   - "By Year" view: papers with `preprint: true` go under "Preprints" (top);
#     everything else is grouped by `year` automatically.
#   - authors: plain text; "Haotian Lin" is bolded automatically; use * for equal contribution.
#   - bibtex: (optional) key of an entry in static/bibs/references.bib.
#   - links: (optional) shown as [name] after the venue line.

